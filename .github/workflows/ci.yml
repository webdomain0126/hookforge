name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hookforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hookforge
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Apply migrations
        run: |
          for f in migrations/*.sql; do
            psql -h localhost -U postgres -d hookforge -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked